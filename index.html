<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b264c">
  <meta name="description" content="Pusat Layanan GA Services untuk pengaduan, kritik dan saran, serta regulasi mess.">
  <title>Pusat Layanan GA Services</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b264c'/%3E%3Cpath d='M8 26V6h16v20M8 26h16' fill='none' stroke='%23ff933e' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M18 16h2' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --navy: #0b264c;
      --muted: #475e79;
      --line: #dbe5ef;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      min-width: 280px;
      min-height: 100vh;
      margin: 0;
      border-top: 4px solid var(--navy);
      background: linear-gradient(180deg, #fff 0, #f5f8fc 100%);
      color: var(--navy);
    }
    .shell { width: min(560px, calc(100% - 40px)); margin-inline: auto; }
    .masthead {
      display: grid;
      justify-items: center;
      padding-block: clamp(28px, 6vh, 58px) 26px;
      text-align: center;
    }
    .brand { display: block; width: min(270px, 78%); height: auto; }
    .masthead-rule {
      width: 40px;
      height: 3px;
      margin-top: 20px;
      border-radius: 3px;
      background: #f58332;
    }
    h1 {
      margin: 13px 0 7px;
      font-size: clamp(1.82rem, 5.65vw, 2.42rem);
      font-weight: 800;
      letter-spacing: -.046em;
      line-height: 1.12;
    }
    h1 span { white-space: nowrap; }
    .masthead p {
      margin: 0;
      color: var(--muted);
      font-size: .94rem;
      line-height: 1.5;
    }

    .service-list {
      display: grid;
      gap: 11px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .service-card {
      display: grid;
      grid-template-columns: 45px minmax(0, 1fr) 19px;
      align-items: center;
      min-height: 79px;
      gap: 14px;
      padding: 13px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 4px 15px #12396708;
      color: inherit;
      text-decoration: none;
      transition: border-color .18s ease, background-color .18s ease;
    }
    .service-card[href]:hover { border-color: #a8c0da; background: #f5faff; }
    .service-card[href]:focus-visible { outline: 3px solid #1d63a9; outline-offset: 3px; }
    .service-icon {
      display: grid;
      width: 45px;
      height: 45px;
      place-items: center;
      border-radius: 11px;
      background: #eaf2fb;
      color: #18477c;
    }
    .service-icon svg { width: 22px; height: 22px; }
    .service-icon.warm { background: #fff1e6; color: #9f4310; }
    .service-title, .service-description { display: block; }
    .service-title { margin-bottom: 2px; font-size: 1rem; font-weight: 750; }
    .service-description { color: var(--muted); font-size: .84rem; line-height: 1.45; }
    .service-arrow { width: 18px; height: 18px; color: #365e89; }
    .service-card.is-pending { grid-template-columns: 45px minmax(0, 1fr); }
    .availability {
      display: inline-block;
      margin-top: 6px;
      padding: 2px 7px;
      border-radius: 5px;
      background: #edf2f8;
      color: #3d5878;
      font-size: .71rem;
      font-weight: 700;
      line-height: 1.45;
    }
    footer {
      padding-block: 20px 27px;
      color: #526883;
      font-size: .78rem;
      text-align: center;
    }

    .entrance {
      position: fixed;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: radial-gradient(ellipse at 50% 46%, #1d4070, #081b37 70%);
    }
    .entrance-view { display: grid; justify-items: center; gap: 18px; }

      position: absolute;
      /* The leaf occupies x=65..779 and y=87..1422 in the original 844 × 1441 artwork. */

      background: radial-gradient(ellipse at center, #fffdf8 0 26%, #e4effd 70%, #9dbce1);

      perspective-origin: 50% 45%;
    }
    .door-leaf {
      position: absolute;
      inset: 0;

      100% { transform: rotateY(-106deg); }

    @keyframes entrance-out {
      0%, 77% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }

    @media (prefers-reduced-motion: reduce) {
      .entrance { display: none !important; }
      .service-card { transition: none; }
    }

  <script>
    const regulation = document.getElementById('regulasi-mess');
    const regulationUrl = regulation.dataset.url.trim();
    if (regulationUrl) {
      regulation.href = regulationUrl;
      regulation.classList.remove('is-pending');
      regulation.querySelector('.availability').hidden = true;
      regulation.querySelector('.service-arrow').hidden = false;
    }

    const entrance = document.getElementById('entrance');
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      entrance.hidden = false;
      entrance.classList.add('is-playing');

      const dismissEntrance = () => {
        entrance.hidden = true;
        document.removeEventListener('focusin', dismissEntrance);
      };
      entrance.addEventListener('animationend', (event) => {
        if (event.target === entrance) dismissEntrance();
      });
      entrance.addEventListener('click', dismissEntrance, { once: true });
      document.addEventListener('focusin', dismissEntrance, { once: true });
      window.setTimeout(dismissEntrance, 2050);
    }
  </script>
