<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Link Center - GA Services</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: Arial, Helvetica, sans-serif;
        min-height: 100vh;
        background: linear-gradient(135deg, #eef4ff, #f7f9fc);
        color: #1f2937;
    }
    header {
        background: linear-gradient(135deg, #123b73, #1769aa);
        color: white;
        padding: 28px 6%;
        box-shadow: 0 4px 18px rgba(0,0,0,.12);
    }
    header h1 { font-size: 28px; margin-bottom: 6px; }
    header p { opacity: .85; }
    .container { width: min(1100px, 92%); margin: 35px auto; }
    .toolbar {
        display: flex;
        gap: 12px;
        margin-bottom: 24px;
        flex-wrap: wrap;
    }
    .search {
        flex: 1;
        min-width: 220px;
        padding: 13px 16px;
        border: 1px solid #d6dce5;
        border-radius: 12px;
        outline: none;
        background: white;
    }
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
    }
    .card {
        background: white;
        border-radius: 18px;
        padding: 22px;
        box-shadow: 0 8px 25px rgba(31,41,55,.08);
        border: 1px solid #e8edf3;
    }
    .card h2 { font-size: 20px; margin-bottom: 16px; color: #123b73; }
    .sub-buttons { display: grid; gap: 10px; }
    .link-btn {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        text-decoration: none;
        padding: 12px 14px;
        border-radius: 10px;
        background: #f3f7fc;
        color: #1e3a5f;
        border: 1px solid #e0e8f2;
        transition: .2s;
        cursor: pointer;
    }
    .link-btn:hover {
        transform: translateY(-2px);
        background: #e8f1fb;
        border-color: #b9d0ea;
    }
    .empty {
        text-align: center;
        padding: 40px;
        color: #6b7280;
        display: none;
    }
    footer {
        text-align: center;
        color: #6b7280;
        padding: 30px;
        font-size: 13px;
    }
    @media (max-width: 600px) {
        header h1 { font-size: 23px; }
        .container { margin-top: 22px; }
    }
</style>
</head>
<body>

<header>
    <h1>📌 Link Center</h1>
    <p>Pusat akses link administrasi dan layanan</p>
</header>

<main class="container">
    <div class="toolbar">
        <input id="search" class="search" type="text" placeholder="🔎 Cari menu atau sub menu...">
    </div>

    <section id="menuGrid" class="grid">

        <div class="card menu-card">
            <h2>🕒 Absensi</h2>
            <div class="sub-buttons">
                <a class="link-btn" href="https://contoh.com/absensi" target="_blank">
                    <span>Absensi Karyawan</span><span>↗</span>
                </a>
                <a class="link-btn" href="https://contoh.com/rekap-absensi" target="_blank">
                    <span>Rekap Absensi</span><span>↗</span>
                </a>
                <a class="link-btn" href="https://contoh.com/izin" target="_blank">
                    <span>Pengajuan Izin</span><span>↗</span>
                </a>
            </div>
        </div>

        <div class="card menu-card">
            <h2>📊 Data COS</h2>
            <div class="sub-buttons">
                <a class="link-btn" href="https://contoh.com/data-cos" target="_blank">
                    <span>Data COS</span><span>↗</span>
                </a>
                <a class="link-btn" href="https://contoh.com/rekap-cos" target="_blank">
                    <span>Rekap COS</span><span>↗</span>
                </a>
                <a class="link-btn" href="https://contoh.com/jadwal-cos" target="_blank">
                    <span>Jadwal COS</span><span>↗</span>
                </a>
            </div>
        </div>

        <div class="card menu-card">
            <h2>👆 Form Finger</h2>
            <div class="sub-buttons">
                <a class="link-btn" href="https://contoh.com/form-finger" target="_blank">
                    <span>Form Finger</span><span>↗</span>
                </a>
                <a class="link-btn" href="https://contoh.com/rekap-finger" target="_blank">
                    <span>Rekap Form Finger</span><span>↗</span>
                </a>
            </div>
        </div>

    </section>

    <div id="empty" class="empty">Menu tidak ditemukan.</div>
</main>

<footer>
    Link Center • Silakan ganti URL contoh dengan link sebenarnya.
</footer>

<script>
const search = document.getElementById("search");
const cards = document.querySelectorAll(".menu-card");
const empty = document.getElementById("empty");

search.addEventListener("input", function () {
    const keyword = this.value.toLowerCase().trim();
    let visible = 0;

    cards.forEach(card => {
        const text = card.innerText.toLowerCase();
        const show = text.includes(keyword);
        card.style.display = show ? "" : "none";
        if (show) visible++;
    });

    empty.style.display = visible ? "none" : "block";
});
</script>

</body>
</html>
