<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aduan & Kritik</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#1d2671,#c33764);
  min-height:100vh;
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  color:#fff;
}
.container{
  width:100%;
  max-width:420px;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(10px);
  border-radius:20px;
  padding:26px;
  box-shadow:0 8px 30px rgba(0,0,0,.35);
}
.logos{
  display:flex;
  justify-content:center;
  margin-bottom:18px;
}
.logos img{
  width:80%;
  max-width:400px;
  height:auto;
  border-radius:10px;
  display:block;
}
h1{text-align:center;font-weight:700;margin:6px 0}
p{text-align:center;font-size:14px;opacity:.75;margin-bottom:24px}
.menu{display:grid;gap:14px}
.card{
  background:rgba(255,255,255,.22);
  padding:18px;
  border-radius:15px;
  display:flex;
  align-items:center;
  gap:14px;
  cursor:pointer;
  transition:.15s;
}
.card:hover{background:rgba(255,255,255,.3);transform:translateY(-2px)}
.card:active{transform:scale(.97)}
.icon-wrap{
  width:46px;height:46px;
  border-radius:50%;
  background:rgba(255,255,255,.25);
  display:flex;
  justify-content:center;
  align-items:center;
  flex-shrink:0;
}
.icon{width:24px;height:24px}
.title{font-weight:600;font-size:15px;display:block}
.desc{font-weight:400;font-size:12px;opacity:.8;display:block;margin-top:2px}
footer{text-align:center;margin-top:22px;font-size:12px;opacity:.65}
</style>
</head>

<body>
<div class="container">

<!-- LOGO -->
<div class="logos">
  <img src="logo-perusahaan.png" alt="Logo Perusahaan">
</div>

<h1>Aduan & Kritik</h1>
<p>Silakan pilih menu di bawah ini</p>

<!-- MENU -->
<div class="menu">

  <div class="card" onclick="location.href='https://forms.gle/uwBUM1tEZujgmLaDA'">
    <div class="icon-wrap">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    </div>
    <div class="text">
      <span class="title">Aduan</span>
      <span class="desc">Sampaikan aduan terkait fasilitas</span>
    </div>
  </div>

  <div class="card" onclick="location.href='https://forms.gle/VNbBCPu6H6U7XjQj9'">
    <div class="icon-wrap">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </div>
    <div class="text">
      <span class="title">Kritik & Saran</span>
      <span class="desc">Kirim kritik dan saran untuk layanan</span>
    </div>
  </div>

</div>

<footer>© 2026 Sistem Fasilitas</footer>
</div>
</body>
</html>
